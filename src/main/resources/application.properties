spring.config.import=optional:file:.env[.properties]
spring.application.name=web-integrado-service

# Si no se indica otro perfil, se utiliza la configuración SQL Server del archivo .env
spring.profiles.default=dev

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:28800000}

# CORS general
cors.allowOrigins=http://localhost:4200,http://localhost:5173
cors.allowMethods=GET,POST,PUT,DELETE
cors.allowHeaders=*
cors.exposedHeaders=Authorization
cors.maxAge=3600
cors.allowCredentials=true
cors.mapping=/**

# RF-03: parámetros centralizados del cálculo automático de prioridad
app.incidencia.prioridad.ventana-reincidencia-dias=${INCIDENCIA_PRIORIDAD_VENTANA_DIAS:30}
app.incidencia.prioridad.peso-impacto=${INCIDENCIA_PRIORIDAD_PESO_IMPACTO:0.40}
app.incidencia.prioridad.peso-urgencia=${INCIDENCIA_PRIORIDAD_PESO_URGENCIA:0.40}
app.incidencia.prioridad.peso-reincidencia=${INCIDENCIA_PRIORIDAD_PESO_REINCIDENCIA:0.20}
