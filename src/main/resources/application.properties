spring.application.name=web-integrado-service

# Si no se indica otro perfil, se utiliza desarrollo
spring.profiles.default=dev

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:28800000}

# CORS general
cors.allowOrigins=http://localhost:5173
cors.allowMethods=GET,POST,PUT,DELETE
cors.allowHeaders=*
cors.exposedHeaders=Authorization
cors.maxAge=3600
cors.allowCredentials=true
cors.mapping=/**