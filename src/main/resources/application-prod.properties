# SQL Server 2019 de produccion
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Dialecto utilizado por Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# La base ya fue creada manualmente
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# No mostrar consultas SQL en produccion
spring.jpa.show-sql=false

# Herramientas de desarrollo desactivadas
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Origen permitido para el frontend
cors.allowOrigins=${CORS_ALLOWED_ORIGINS}