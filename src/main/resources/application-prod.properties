# Base de datos MySQL para produccion
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# En produccion no se crean ni cargan tablas automaticamente
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# Herramientas de desarrollo desactivadas
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Origen permitido del frontend de produccion
cors.allowOrigins=${CORS_ALLOWED_ORIGINS}